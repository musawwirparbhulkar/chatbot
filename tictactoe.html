<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe vs AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1226;
    --panel: #181b3a;
    --accent: #7c5cff;
    --accent-2: #5ce1ff;
    --x-color: #ff6b6b;
    --o-color: #4dd0e1;
    --text: #e8eaff;
    --muted: #9aa0c7;
    --win: #ffd166;
  }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1d44 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    background: var(--panel);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
    width: min(420px, 100%);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    font-size: 11px;
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(124,92,255,0.3);
  }
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .score {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .score .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .score .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .score.x .value { color: var(--x-color); }
  .score.o .value { color: var(--o-color); }
  .score.d .value { color: var(--muted); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .controls select, .controls button {
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .controls select:hover, .controls button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.15);
  }
  .controls button.primary {
    background: linear-gradient(90deg, var(--accent), #5b4cff);
    border: none;
    font-weight: 600;
  }
  .controls button.primary:hover { filter: brightness(1.1); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1 / 1;
    margin-bottom: 16px;
  }
  .cell {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
    transition: all 0.18s ease;
    position: relative;
  }
  .cell:hover:not(.taken):not(.game-over) {
    background: rgba(255,255,255,0.08);
    transform: scale(1.02);
  }
  .cell.taken { cursor: not-allowed; }
  .cell.x { color: var(--x-color); }
  .cell.o { color: var(--o-color); }
  .cell.win {
    background: rgba(255,209,102,0.18);
    border-color: var(--win);
    animation: pulse 0.6s ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .cell .mark {
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .status {
    text-align: center;
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .status.win { background: rgba(255,209,102,0.12); color: var(--win); font-weight: 600; }
  .status.lose { background: rgba(255,107,107,0.12); color: var(--x-color); font-weight: 600; }
  .status.draw { background: rgba(154,160,199,0.12); color: var(--muted); font-weight: 600; }
  .status.thinking { color: var(--muted); }

  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Tic-Tac-Toe</h1>
      <span class="badge" id="difficultyBadge">Minimax</span>
    </header>

    <div class="scoreboard">
      <div class="score x"><div class="label">You (X)</div><div class="value" id="scoreX">0</div></div>
      <div class="score d"><div class="label">Draws</div><div class="value" id="scoreD">0</div></div>
      <div class="score o"><div class="label">AI (O)</div><div class="value" id="scoreO">0</div></div>
    </div>

    <div class="controls">
      <select id="difficulty">
        <option value="easy">Easy (random)</option>
        <option value="medium">Medium (heuristic)</option>
        <option value="hard" selected>Hard (Minimax)</option>
      </select>
      <select id="side">
        <option value="X" selected>Play as X (first)</option>
        <option value="O">Play as O (second)</option>
      </select>
      <button class="primary" id="newGameBtn">New Game</button>
    </div>

    <div class="board" id="board">
      <div class="cell" data-i="0"></div>
      <div class="cell" data-i="1"></div>
      <div class="cell" data-i="2"></div>
      <div class="cell" data-i="3"></div>
      <div class="cell" data-i="4"></div>
      <div class="cell" data-i="5"></div>
      <div class="cell" data-i="6"></div>
      <div class="cell" data-i="7"></div>
      <div class="cell" data-i="8"></div>
    </div>

    <div class="status" id="status">Your move. You are X.</div>

    <footer>Click a cell to play. AI will respond automatically.</footer>
  </div>

<script>
(() => {
  'use strict';

  const HUMAN = 'X';
  const AI = 'O';
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const els = {
    cells: Array.from(document.querySelectorAll('.cell')),
    status: document.getElementById('status'),
    board: document.getElementById('board'),
    scoreX: document.getElementById('scoreX'),
    scoreO: document.getElementById('scoreO'),
    scoreD: document.getElementById('scoreD'),
    newGameBtn: document.getElementById('newGameBtn'),
    difficulty: document.getElementById('difficulty'),
    side: document.getElementById('side'),
    badge: document.getElementById('difficultyBadge')
  };

  const state = {
    board: Array(9).fill(''),
    turn: HUMAN,
    over: false,
    scores: { X: 0, O: 0, D: 0 },
    playerSide: HUMAN,
    difficulty: 'hard',
    thinking: false
  };

  function setStatus(text, cls='') {
    els.status.textContent = text;
    els.status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function render() {
    els.cells.forEach((cell, i) => {
      const v = state.board[i];
      cell.innerHTML = v ? `<span class="mark">${v}</span>` : '';
      cell.classList.toggle('x', v === 'X');
      cell.classList.toggle('o', v === 'O');
      cell.classList.toggle('taken', !!v);
      cell.classList.remove('win');
    });
  }

  function availableMoves(b) {
    const out = [];
    for (let i = 0; i < 9; i++) if (!b[i]) out.push(i);
    return out;
  }

  function winner(b) {
    for (const [a,c,d] of WIN_LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    return null;
  }

  function isDraw(b) {
    return !winner(b) && b.every(c => c);
  }

  function gameOver(b) {
    return winner(b) || isDraw(b);
  }

  // ----- AI -----

  // Easy: pick a random available cell.
  function aiEasy(b) {
    const moves = availableMoves(b);
    return moves[Math.floor(Math.random() * moves.length)];
  }

  // Medium: take winning move if available, block opponent's win, else random.
  function aiMedium(b) {
    const me = AI;
    const opp = HUMAN;
    // try to win
    for (const i of availableMoves(b)) {
      const copy = b.slice(); copy[i] = me;
      if (winner(copy) === me) return i;
    }
    // block
    for (const i of availableMoves(b)) {
      const copy = b.slice(); copy[i] = opp;
      if (winner(copy) === opp) return i;
    }
    // take center
    if (!b[4]) return 4;
    // take a corner
    const corners = [0,2,6,8].filter(i => !b[i]);
    if (corners.length) return corners[Math.floor(Math.random()*corners.length)];
    return aiEasy(b);
  }

  // Hard: Minimax. Returns index of best move for `player`.
  function minimax(b, player) {
    const win = winner(b);
    if (win === AI) return { score: 10 };
    if (win === HUMAN) return { score: -10 };
    if (isDraw(b)) return { score: 0 };

    const moves = [];
    for (const i of availableMoves(b)) {
      const move = {};
      move.index = i;
      b[i] = player;
      if (player === AI) {
        const result = minimax(b, HUMAN);
        move.score = result.score;
      } else {
        const result = minimax(b, AI);
        move.score = result.score;
      }
      b[i] = '';
      moves.push(move);
    }

    let best;
    if (player === AI) {
      best = moves.reduce((a, c) => c.score > a.score ? c : a);
    } else {
      best = moves.reduce((a, c) => c.score < a.score ? c : a);
    }
    return best;
  }

  function aiHard(b) {
    return minimax(b, AI).index;
  }

  function aiMove() {
    if (state.over) return;
    let move;
    if (state.difficulty === 'easy') move = aiEasy(state.board);
    else if (state.difficulty === 'medium') move = aiMedium(state.board);
    else move = aiHard(state.board);
    playMove(move, AI);
  }

  // ----- Game flow -----

  function playMove(i, player) {
    if (state.over || state.board[i] || state.thinking) return;
    state.board[i] = player;
    render();

    const w = winner(state.board);
    if (w) {
      state.over = true;
      highlightWin(w);
      const playerSide = state.playerSide;
      if (w === playerSide) {
        state.scores[playerSide]++;
        setStatus(`You win! 🎉`, 'win');
      } else {
        state.scores[w]++;
        setStatus(`AI wins. Better luck next time.`, 'lose');
      }
      updateScores();
      return;
    }
    if (isDraw(state.board)) {
      state.over = true;
      state.scores.D++;
      setStatus(`It's a draw.`, 'draw');
      updateScores();
      return;
    }
    state.turn = state.turn === HUMAN ? AI : HUMAN;
    if (state.turn === AI) {
      state.thinking = true;
      setStatus('AI is thinking…', 'thinking');
      // small delay so user can see the move
      setTimeout(() => {
        state.thinking = false;
        aiMove();
        if (!state.over) {
          const side = state.playerSide;
          setStatus(side === HUMAN ? 'Your move.' : "AI moved. Your turn.");
        }
      }, 250);
    } else {
      const side = state.playerSide;
      setStatus(side === HUMAN ? 'Your move.' : "Your move. You are O.");
    }
  }

  function highlightWin(player) {
    for (const [a,c,d] of WIN_LINES) {
      if (state.board[a] === player && state.board[c] === player && state.board[d] === player) {
        [a,c,d].forEach(i => els.cells[i].classList.add('win'));
        return;
      }
    }
  }

  function updateScores() {
    els.scoreX.textContent = state.scores.X;
    els.scoreO.textContent = state.scores.O;
    els.scoreD.textContent = state.scores.D;
  }

  function newGame() {
    state.board = Array(9).fill('');
    state.over = false;
    state.thinking = false;
    state.playerSide = els.side.value;
    state.turn = HUMAN; // X always goes first
    state.difficulty = els.difficulty.value;
    els.badge.textContent =
      state.difficulty === 'easy' ? 'Easy' :
      state.difficulty === 'medium' ? 'Medium' : 'Minimax';
    render();
    if (state.playerSide === AI) {
      setStatus('AI moves first…', 'thinking');
      state.thinking = true;
      setTimeout(() => {
        state.thinking = false;
        aiMove();
        if (!state.over) setStatus('Your move. You are O.');
      }, 350);
    } else {
      setStatus('Your move. You are X.');
    }
  }

  // ----- Wire up -----
  els.cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (state.turn !== state.playerSide) return;
      playMove(i, state.playerSide);
    });
  });
  els.newGameBtn.addEventListener('click', newGame);
  els.difficulty.addEventListener('change', newGame);
  els.side.addEventListener('change', newGame);

  newGame();
})();
</script>
</body>
</html>
